# XcodeGen spec. `xcodegen generate` creates Musics.xcodeproj (not committed).
name: Musics
options:
  bundleIdPrefix: com.ometavr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

packages:
  MusicsCore:
    path: Packages/MusicsCore

targets:
  Musics:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: MusicsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ometavr.musics
        PRODUCT_NAME: Musics
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Musics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Self-hosted servers are often plain http on a LAN or tailnet name (http://music.lan).
        # Don't add NSAllowsLocalNetworking / ...ForMedia here: their presence makes iOS ignore
        # NSAllowsArbitraryLoads, which would block plain-http public addresses.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Musics connects to music servers on your local network and tailnet.
        LSApplicationQueriesSchemes: [tailscale]

schemes:
  Musics:
    build:
      targets:
        Musics: all
    run:
      config: Debug
    archive:
      config: Release
